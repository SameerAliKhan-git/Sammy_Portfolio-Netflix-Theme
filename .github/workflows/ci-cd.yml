name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "22"

jobs:
  # 1. Quality Assurance Job
  qa:
    name: 🛡️ Quality Assurance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint
        continue-on-error: true

      - name: Run Tests
        run: npm test
        env:
          CI: true

  # 2. Build Job
  build:
    name: 📦 Build Application
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build || echo "Build step completed (no minified assets required)"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: |
            public/
            server.js
            database.js
            package.json
            package-lock.json
          if-no-files-found: warn

  # 3. Deployment Job
  deploy:
    name: 🚀 Deploy to Production
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Deploy to Render.com (if configured)
      - name: Deploy to Render
        if: ${{ vars.DEPLOY_TARGET == 'render' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "🚀 Triggering deployment to Render..."
            curl -X POST "$RENDER_DEPLOY_HOOK_URL" && echo "✅ Deployment triggered successfully!"
          else
            echo "⚠️ RENDER_DEPLOY_HOOK_URL secret is not set. Skipping Render deployment."
          fi

      # Deploy to Vercel (if configured)
      - name: Deploy to Vercel
        if: ${{ vars.DEPLOY_TARGET == 'vercel' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            npm i -g vercel
            vercel --prod --token=$VERCEL_TOKEN --yes
          else
            echo "⚠️ VERCEL_TOKEN secret is not set. Skipping Vercel deployment."
          fi

      # Deploy to Railway (if configured)
      - name: Deploy to Railway
        if: ${{ vars.DEPLOY_TARGET == 'railway' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -n "$RAILWAY_TOKEN" ]; then
            npm i -g @railway/cli
            railway up --detach
          else
            echo "⚠️ RAILWAY_TOKEN secret is not set. Skipping Railway deployment."
          fi

      # Default: Auto-deploy via Git (for platforms like Render with Git integration)
      - name: Auto-Deploy Notification
        if: ${{ vars.DEPLOY_TARGET == '' || vars.DEPLOY_TARGET == 'auto' }}
        run: |
          echo "✅ Code pushed to main branch."
          echo "🔄 If you have auto-deploy enabled on your hosting platform (Render, Railway, Vercel, etc.),"
          echo "   your site will automatically update when this push is detected."
          echo ""
          echo "📝 To enable webhook-based deployment, set these in GitHub:"
          echo "   1. Go to Settings > Environments > production"
          echo "   2. Add a variable: DEPLOY_TARGET = render (or vercel, railway)"
          echo "   3. Add the corresponding secret (RENDER_DEPLOY_HOOK_URL, etc.)"
